<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>CyberOCR Architect - Client-Side Extraction Engine</title>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    :root {
      --bg-base: #0f121d;
      --shadow-dark: #0a0c13;
      --shadow-light: #141827;
      --neon-cyan: #00f3ff;
      --neon-magenta: #ff0055;
      --neon-emerald: #00ff88;
      --text-main: #d0d7f0;
      --text-dim: #6c7a9c;
      --card-bg: #0f121d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 20px;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 25px;
      margin-bottom: 20px;
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
      border: 1px solid rgba(0, 243, 255, 0.1);
    }

    h1 {
      font-size: 1.4rem;
      letter-spacing: 1.5px;
      color: var(--neon-cyan);
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .doc-selector {
      background: var(--bg-base);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 10px 15px;
      border-radius: 8px;
      outline: none;
      font-weight: bold;
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      cursor: pointer;
    }

    .upload-section {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    .dropzone {
      background: var(--card-bg);
      border: 2px dashed var(--text-dim);
      border-radius: 12px;
      padding: 25px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
    }

    .dropzone:hover, .dropzone.dragover {
      border-color: var(--neon-cyan);
      box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);
    }

    .dropzone p {
      color: var(--text-dim);
      font-size: 0.9rem;
      margin-top: 8px;
    }

    .main-dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      flex: 1;
    }

    .pane {
      background: var(--card-bg);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 8px 8px 18px var(--shadow-dark), -8px -8px 18px var(--shadow-light);
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .pane-title {
      font-size: 1.1rem;
      color: var(--neon-cyan);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .controls-bar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cyber-btn {
      background: var(--bg-base);
      color: var(--neon-cyan);
      border: 1px solid var(--neon-cyan);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
      transition: all 0.2s;
    }

    .cyber-btn:hover {
      background: var(--neon-cyan);
      color: var(--bg-base);
      box-shadow: 0 0 10px var(--neon-cyan);
    }

    .cyber-btn.export-btn {
      border-color: var(--neon-emerald);
      color: var(--neon-emerald);
    }

    .cyber-btn.export-btn:hover {
      background: var(--neon-emerald);
      color: var(--bg-base);
      box-shadow: 0 0 10px var(--neon-emerald);
    }

    .canvas-container {
      position: relative;
      width: 100%;
      height: 480px;
      background: #05060a;
      border-radius: 8px;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: inset 4px 4px 10px var(--shadow-dark), inset -4px -4px 10px var(--shadow-light);
    }

    canvas {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .form-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 520px;
      overflow-y: auto;
      padding-right: 5px;
    }

    .field-card {
      background: var(--bg-base);
      border-radius: 8px;
      padding: 12px;
      box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
      border-left: 4px solid var(--text-dim);
    }

    .field-card.success {
      border-left-color: var(--neon-emerald);
    }

    .field-card.error {
      border-left-color: var(--neon-magenta);
    }

    .field-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .field-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }

    .badge.success {
      background: rgba(0, 255, 136, 0.15);
      color: var(--neon-emerald);
      border: 1px solid var(--neon-emerald);
    }

    .badge.error {
      background: rgba(255, 0, 85, 0.15);
      color: var(--neon-magenta);
      border: 1px solid var(--neon-magenta);
    }

    .field-value {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 500;
      outline: none;
    }

    .justification-text {
      font-size: 0.75rem;
      color: var(--neon-magenta);
      margin-top: 4px;
    }

    .img-preview-box {
      max-height: 100px;
      max-width: 200px;
      border: 1px solid var(--neon-emerald);
      border-radius: 4px;
      margin-top: 5px;
    }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--shadow-dark);
      border-radius: 3px;
      overflow: hidden;
      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--neon-cyan);
      box-shadow: 0 0 8px var(--neon-cyan);
      transition: width 0.2s;
    }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--shadow-light); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--neon-cyan); }
  </style>
</head>
<body>

  <header>
    <h1><span style="color:var(--neon-magenta)">///</span> CyberOCR Engine</h1>
    <div>
      <label for="docTypeSelector" style="font-size:0.85rem; color: var(--text-dim); margin-right: 8px;">TARGET SCHEMA:</label>
      <select id="docTypeSelector" class="doc-selector" onchange="switchSchema()">
        <option value="MY_KAD">Malaysian NRIC (MyKad)</option>
        <option value="MY_PR">Malaysian Permanent Resident (MyPR)</option>
        <option value="INTL_PASSPORT">International Passport</option>
        <option value="MY_PASSPORT">Malaysian Passport</option>
        <option value="MY_DRIVING">Malaysian Driving License</option>
        <option value="INTL_DRIVING">International Driving License</option>
        <option value="SSM_CERT">SSM Certificate (Suruhanjaya Syarikat)</option>
        <option value="CIDB_PPK">CIDB PPK Certificate</option>
      </select>
    </div>
  </header>

  <div class="upload-section">
    <div class="dropzone" id="dzFront" onclick="document.getElementById('fileFront').click()">
      <h3>PAGE 1 / FRONT CARD</h3>
      <p>Drop image/PDF or click to upload (up to 500MB)</p>
      <input type="file" id="fileFront" style="display:none" accept="image/*,application/pdf,.tiff,.heic" onchange="handleFileSelect(event, 'front')" />
    </div>
    <div class="dropzone" id="dzBack" onclick="document.getElementById('fileBack').click()">
      <h3>PAGE 2 / BACK CARD</h3>
      <p>Drop image/PDF or click to upload (up to 500MB)</p>
      <input type="file" id="fileBack" style="display:none" accept="image/*,application/pdf,.tiff,.heic" onchange="handleFileSelect(event, 'back')" />
    </div>
  </div>

  <div class="progress-bar-container" id="progressContainer">
    <div class="progress-bar" id="progressBar"></div>
  </div>

  <div class="main-dashboard">
    <div class="pane">
      <div class="pane-title">
        <span>Preprocessing & Visual Inspector</span>
        <span id="markerDetectionBadge" class="badge" style="display:none;"></span>
      </div>
      <div class="controls-bar">
        <button class="cyber-btn" onclick="rotateCanvas(90)">Rotate 90°</button>
        <button class="cyber-btn" onclick="toggleEnhanceContrast()">Enhance Contrast</button>
        <button class="cyber-btn" onclick="toggleBinarization()">Noise Filter</button>
        <button class="cyber-btn" onclick="resetCanvas()">Reset Image</button>
      </div>
      <div class="canvas-container">
        <canvas id="viewCanvas"></canvas>
      </div>
    </div>

    <div class="pane">
      <div class="pane-title">
        <span>Structured Field Inspection</span>
        <button class="cyber-btn export-btn" onclick="exportJSON()">Export JSON Payload</button>
      </div>
      <div class="form-container" id="formContainer">
        </div>
    </div>
  </div>

  <script>
    // State Codes Lookup Table for Malaysian ICs
    const MY_STATE_CODES = {
      '01':'Johor','21':'Johor','22':'Johor','23':'Johor','24':'Johor',
      '02':'Kedah','25':'Kedah','26':'Kedah','27':'Kedah',
      '03':'Kelantan','28':'Kelantan','29':'Kelantan',
      '04':'Melaka','30':'Melaka',
      '05':'Negeri Sembilan','31':'Negeri Sembilan','59':'Negeri Sembilan',
      '06':'Pahang','32':'Pahang','33':'Pahang',
      '07':'Penang','34':'Penang','35':'Penang',
      '08':'Perak','36':'Perak','37':'Perak','38':'Perak','39':'Perak',
      '09':'Perlis','40':'Perlis',
      '10':'Selangor','41':'Selangor','42':'Selangor','43':'Selangor','44':'Selangor',
      '11':'Terengganu','45':'Terengganu','46':'Terengganu',
      '12':'Sabah','47':'Sabah','48':'Sabah','49':'Sabah',
      '13':'Sarawak','50':'Sarawak','51':'Sarawak','52':'Sarawak','53':'Sarawak',
      '14':'Wilayah Persekutuan (KL)','54':'Wilayah Persekutuan (KL)','55':'Wilayah Persekutuan (KL)',
      '15':'Wilayah Persekutuan (Labuan)','56':'Wilayah Persekutuan (Labuan)',
      '16':'Wilayah Persekutuan (Putrajaya)','57':'Wilayah Persekutuan (Putrajaya)'
    };

    // Application Global State
    const appState = {
      currentSchema: 'MY_KAD',
      images: { front: null, back: null },
      processedCanvas: { front: null, back: null },
      rotation: { front: 0, back: 0 },
      enhanced: false,
      binarized: false,
      activeSide: 'front',
      ocrResults: { front: null, back: null },
      extractedPayload: {}
    };

    // Initialize PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    window.addEventListener('DOMContentLoaded', () => {
      setupDragAndDrop();
      switchSchema();
    });

    function setupDragAndDrop() {
      ['dzFront', 'dzBack'].forEach(id => {
        const dz = document.getElementById(id);
        const side = id === 'dzFront' ? 'front' : 'back';
        dz.addEventListener('dragover', (e) => { e.preventDefault(); dz.classList.add('dragover'); });
        dz.addEventListener('dragleave', () => dz.classList.remove('dragover'));
        dz.addEventListener('drop', (e) => {
          e.preventDefault();
          dz.classList.remove('dragover');
          if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0], side);
        });
      });
    }

    function handleFileSelect(evt, side) {
      if (evt.target.files.length) processFile(evt.target.files[0], side);
    }

    async function processFile(file, side) {
      appState.activeSide = side;
      showProgress(10);
      if (file.type === 'application/pdf') {
        const fileBuffer = await file.arrayBuffer();
        const pdf = await pdfjsLib.getDocument({ data: fileBuffer }).promise;
        const page = await pdf.getPage(1);
        const viewport = page.getViewport({ scale: 2.0 });
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        await page.render({ canvasContext: ctx, viewport }).promise;
        const img = new Image();
        img.src = canvas.toDataURL();
        img.onload = () => handleLoadedImage(img, side);
      } else {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.src = e.target.result;
          img.onload = () => handleLoadedImage(img, side);
        };
        reader.readAsDataURL(file);
      }
    }

    function handleLoadedImage(img, side) {
      appState.images[side] = img;
      appState.rotation[side] = 0;
      processCanvasFilters(side);
      runOCR(side);
    }

    function processCanvasFilters(side) {
      const img = appState.images[side];
      if (!img) return;

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const rot = appState.rotation[side];

      if (rot % 180 === 0) {
        canvas.width = img.width;
        canvas.height = img.height;
      } else {
        canvas.width = img.height;
        canvas.height = img.width;
      }

      ctx.save();
      ctx.translate(canvas.width / 2, canvas.height / 2);
      ctx.rotate((rot * Math.PI) / 180);
      ctx.drawImage(img, -img.width / 2, -img.height / 2);
      ctx.restore();

      let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let data = imgData.data;

      // Color detection for markers (Blue for MyKad, Red for MyPR)
      if (side === 'front') detectCardTheme(data);

      if (appState.enhanced || appState.binarized) {
        for (let i = 0; i < data.length; i += 4) {
          let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
          if (appState.enhanced) {
            // Contrast Stretching & Overlay Filter
            avg = (avg - 128) * 1.4 + 128;
            avg = Math.min(255, Math.max(0, avg));
          }
          if (appState.binarized) {
            // Adaptive Binarization to strip watermark/handwriting noise
            avg = avg > 140 ? 255 : 0;
          }
          data[i] = data[i + 1] = data[i + 2] = avg;
        }
        ctx.putImageData(imgData, 0, 0);
      }

      appState.processedCanvas[side] = canvas;
      renderMainCanvas(canvas);
    }

    function detectCardTheme(data) {
      let rTotal = 0, gTotal = 0, bTotal = 0;
      const step = 4 * 20; // Sample pixels
      let count = 0;
      for (let i = 0; i < data.length; i += step) {
        rTotal += data[i];
        gTotal += data[i + 1];
        bTotal += data[i + 2];
        count++;
      }
      const r = rTotal / count, g = gTotal / count, b = bTotal / count;
      const badge = document.getElementById('markerDetectionBadge');
      badge.style.display = 'inline-block';
      if (b > r + 15 && b > g + 15) {
        badge.className = 'badge success';
        badge.innerText = 'THEME DETECTED: BLUE (MYKAD)';
      } else if (r > b + 15 && r > g + 15) {
        badge.className = 'badge error';
        badge.innerText = 'THEME DETECTED: RED (MYPR)';
      } else {
        badge.style.display = 'none';
      }
    }

    function renderMainCanvas(sourceCanvas) {
      const viewCanvas = document.getElementById('viewCanvas');
      viewCanvas.width = sourceCanvas.width;
      viewCanvas.height = sourceCanvas.height;
      const ctx = viewCanvas.getContext('2d');
      ctx.drawImage(sourceCanvas, 0, 0);

      // Draw bounding box overlays from OCR data
      const res = appState.ocrResults[appState.activeSide];
      if (res && res.data && res.data.words) {
        res.data.words.forEach(word => {
          const { x0, y0, x1, y1 } = word.bbox;
          ctx.strokeStyle = word.confidence > 85 ? '#00ff88' : '#ff0055';
          ctx.lineWidth = 2;
          ctx.strokeRect(x0, y0, x1 - x0, y1 - y0);
        });
      }
    }

    async function runOCR(side) {
      const canvas = appState.processedCanvas[side];
      if (!canvas) return;

      showProgress(30);
      const worker = await Tesseract.createWorker('eng');
      showProgress(60);
      const res = await worker.recognize(canvas);
      await worker.terminate();

      appState.ocrResults[side] = res;
      showProgress(100);
      renderMainCanvas(canvas);
      parseAndExtractData();
    }

    function rotateCanvas(deg) {
      const side = appState.activeSide;
      appState.rotation[side] = (appState.rotation[side] + deg) % 360;
      processCanvasFilters(side);
    }

    function toggleEnhanceContrast() {
      appState.enhanced = !appState.enhanced;
      processCanvasFilters(appState.activeSide);
    }

    function toggleBinarization() {
      appState.binarized = !appState.binarized;
      processCanvasFilters(appState.activeSide);
    }

    function resetCanvas() {
      appState.enhanced = false;
      appState.binarized = false;
      appState.rotation[appState.activeSide] = 0;
      processCanvasFilters(appState.activeSide);
    }

    function showProgress(val) {
      const container = document.getElementById('progressContainer');
      const bar = document.getElementById('progressBar');
      container.style.display = 'block';
      bar.style.width = val + '%';
      if (val >= 100) setTimeout(() => { container.style.display = 'none'; }, 800);
    }

    // Strict Disambiguation Post-Processing Helpers
    function cleanNumeric(str) {
      if (!str) return '';
      return str.replace(/O/gi, '0').replace(/[Il|]/g, '1').replace(/S/gi, '5').replace(/B/g, '8').replace(/Z/gi, '2').trim();
    }

    function cleanAlpha(str) {
      if (!str) return '';
      return str.replace(/0/g, 'O').replace(/1/g, 'I').replace(/5/g, 'S').replace(/8/g, 'B').trim();
    }

    // Schema Parser Engine
    function parseAndExtractData() {
      const frontText = appState.ocrResults.front ? appState.ocrResults.front.data.text : '';
      const backText = appState.ocrResults.back ? appState.ocrResults.back.data.text : '';
      const combinedText = frontText + '\n' + backText;

      const payload = {};
      const fieldsConfig = getSchemaConfig(appState.currentSchema);

      fieldsConfig.forEach(config => {
        let value = '';
        let confidence = 0;
        let justification = '';
        let status = 'error';

        try {
          const res = config.extract(frontText, backText, combinedText);
          value = res.val || '';
          confidence = res.conf || (value ? 90 : 0);
          justification = res.justification || '';
          
          if (value && confidence >= 85) {
            status = 'success';
          } else if (!value) {
            justification = justification || 'Red Text: Field not found or obscured by watermark/noise overlay.';
          } else {
            justification = justification || `Red Text: Low extraction confidence (${confidence}%). Visual validation required.`;
          }
        } catch (e) {
          justification = 'Red Text: Processing error during extraction execution.';
        }

        payload[config.key] = { value, status, confidence, justification, label: config.label, type: config.type };
      });

      appState.extractedPayload = payload;
      renderFormUI();
    }

    function getSchemaConfig(schemaType) {
      switch (schemaType) {
        case 'MY_KAD':
          return [
            {
              key: 'ic_number', label: 'IC Number', type: 'text',
              extract: (f) => {
                const match = f.match(/(\d{6})[\s-]?(\d{2})[\s-]?(\d{4})/);
                if (match) {
                  const raw = cleanNumeric(match[0].replace(/[\s-]/g, ''));
                  return { val: raw.replace(/(\d{6})(\d{2})(\d{4})/, '$1-$2-$3'), conf: 95 };
                }
                return { val: '', conf: 0 };
              }
            },
            {
              key: 'gender', label: 'Gender / Jantina', type: 'text',
              extract: (f, b, c) => {
                const icField = appState.extractedPayload['ic_number'];
                if (icField && icField.value) {
                  const digits = icField.value.replace(/-/g, '');
                  const lastDigit = parseInt(digits.slice(-1), 10);
                  if (!isNaN(lastDigit)) {
                    return { val: lastDigit % 2 === 0 ? 'FEMALE (PEREMPUAN)' : 'MALE (LELAKI)', conf: 99 };
                  }
                }
                return { val: '', conf: 0 };
              }
            },
            {
              key: 'state', label: 'State of Birth (Auto-Derived)', type: 'text',
              extract: () => {
                const icField = appState.extractedPayload['ic_number'];
                if (icField && icField.value) {
                  const pb = icField.value.split('-')[1];
                  const state = MY_STATE_CODES[pb] || 'Unknown/Foreign PB Code';
                  return { val: state, conf: 99 };
                }
                return { val: '', conf: 0 };
              }
            },
            {
              key: 'full_name', label: 'Full Name / Nama', type: 'text',
              extract: (f) => {
                const lines = f.split('\n');
                for (let l of lines) {
                  if (l.includes('NAMA') || l.match(/^[A-Z\s]{5,}$/)) {
                    const clean = l.replace('NAMA', '').replace(/[^A-Z\s]/g, '').trim();
                    if (clean.length > 3) return { val: cleanAlpha(clean), conf: 90 };
                  }
                }
                return { val: '', conf: 0 };
              }
            },
            {
              key: 'address', label: 'Residential Address / Alamat', type: 'text',
              extract: (f) => {
                const lines = f.split('\n');
                let start = false;
                let addrLines = [];
                for (let l of lines) {
                  if (l.includes('ALAMAT') || l.match(/\d{5}/)) start = true;
                  if (start) {
                    if (l.includes('WARGANEGARA') || l.includes('LELAKI') || l.includes('PEREMPUAN')) break;
                    addrLines.push(l.trim());
                  }
                }
                const fullAddr = addrLines.join(' ').replace('ALAMAT', '').trim();
                return { val: fullAddr, conf: fullAddr ? 88 : 0 };
              }
            },
            {
              key: 'citizenship', label: 'Citizenship / Warganegara', type: 'text',
              extract: (f) => f.includes('WARGANEGARA') ? { val: 'WARGANEGARA', conf: 95 } : { val: '', conf: 0 }
            },
            {
              key: 'back_serial', label: 'Back Card Serial Number (SN)', type: 'text',
              extract: (f, b) => {
                const match = b.match(/([A-Z0-9]{10})/);
                return match ? { val: match[1], conf: 90 } : { val: '', conf: 0 };
              }
            }
          ];

        case 'INTL_PASSPORT':
        case 'MY_PASSPORT':
          return [
            { key: 'passport_type', label: 'Type', type: 'text', extract: () => ({ val: 'P', conf: 99 }) },
            {
              key: 'country_code', label: 'Country Code', type: 'text',
              extract: (f) => {
                const match = f.match(/([A-Z]{3})/);
                return match ? { val: cleanAlpha(match[1]), conf: 90 } : { val: 'MYS', conf: 85 };
              }
            },
            {
              key: 'passport_num', label: 'Passport Number', type: 'text',
              extract: (f) => {
                const match = f.match(/([A-Z0-9]{8,9})/);
                return match ? { val: cleanNumeric(match[1]), conf: 92 } : { val: '', conf: 0 };
              }
            },
            {
              key: 'full_name', label: 'Full Name', type: 'text',
              extract: (f) => {
                const lines = f.split('\n');
                const nameLine = lines.find(l => l.includes('NAME') || l.includes('NAMA'));
                return nameLine ? { val: cleanAlpha(nameLine.replace(/NAME|NAMA/g, '')), conf: 88 } : { val: '', conf: 0 };
              }
            },
            {
              key: 'mrz', label: 'Machine-Readable Zone (MRZ)', type: 'text',
              extract: (f) => {
                const lines = f.split('\n');
                const mrzLines = lines.filter(l => l.includes('P<') || l.match(/^[A-Z0-9<]{30,}$/));
                return mrzLines.length ? { val: mrzLines.join('\n'), conf: 96 } : { val: '', conf: 0 };
              }
            }
          ];

        case 'MY_DRIVING':
          return [
            {
              key: 'licence_no', label: 'Identity / License No', type: 'text',
              extract: (f) => {
                const match = f.match(/\d{6}-\d{2}-\d{4}/);
                return match ? { val: match[0], conf: 95 } : { val: '', conf: 0 };
              }
            },
            {
              key: 'class', label: 'Vehicle Class', type: 'text',
              extract: (f) => {
                const match = f.match(/(B2|B|D|DA|E|F|G|H|I)/g);
                return match ? { val: [...new Set(match)].join(', '), conf: 90 } : { val: '', conf: 0 };
              }
            },
            {
              key: 'validity', label: 'Validity Period', type: 'text',
              extract: (f) => {
                const match = f.match(/\d{2}\/\d{2}\/\d{4}\s*-\s*\d{2}\/\d{2}\/\d{4}/);
                return match ? { val: match[0], conf: 92 } : { val: '', conf: 0 };
              }
            }
          ];

        case 'SSM_CERT':
          return [
            {
              key: 'company_name', label: 'Business / Company Name', type: 'text',
              extract: (f) => {
                const lines = f.split('\n');
                const idx = lines.findIndex(l => l.includes('nama') || l.includes('NAMA'));
                return idx !== -1 && lines[idx+1] ? { val: lines[idx+1].trim(), conf: 88 } : { val: '', conf: 0 };
              }
            },
            {
              key: 'reg_no', label: 'Registration Number', type: 'text',
              extract: (f) => {
                const match = f.match(/(\d{9,12}-[A-Z]|\d{12})/);
                return match ? { val: match[0], conf: 94 } : { val: '', conf: 0 };
              }
            }
          ];

        case 'CIDB_PPK':
          return [
            {
              key: 'contractor_name', label: 'Nama Kontraktor', type: 'text',
              extract: (f) => {
                const lines = f.split('\n');
                const idx = lines.findIndex(l => l.includes('KONTRAKTOR') || l.includes('NAMA'));
                return idx !== -1 ? { val: lines[idx].replace(/.*NAMA/g, '').trim(), conf: 86 } : { val: '', conf: 0 };
              }
            },
            {
              key: 'grade', label: 'Gred (Grade)', type: 'text',
              extract: (f) => {
                const match = f.match(/G[1-7]/);
                return match ? { val: match[0], conf: 95 } : { val: '', conf: 0 };
              }
            },
            {
              key: 'category', label: 'Kategori (Category)', type: 'text',
              extract: (f) => {
                const match = f.match(/(B|CE|ME)/g);
                return match ? { val: [...new Set(match)].join(', '), conf: 90 } : { val: '', conf: 0 };
              }
            }
          ];

        default:
          return [];
      }
    }

    function renderFormUI() {
      const container = document.getElementById('formContainer');
      container.innerHTML = '';

      Object.keys(appState.extractedPayload).forEach(key => {
        const field = appState.extractedPayload[key];
        const isSuccess = field.status === 'success';

        const card = document.createElement('div');
        card.className = `field-card ${isSuccess ? 'success' : 'error'}`;

        card.innerHTML = `
          <div class="field-header">
            <span class="field-label">${field.label}</span>
            <span class="badge ${isSuccess ? 'success' : 'error'}">${isSuccess ? 'CONFIDENT (' + field.confidence + '%)' : 'UNCERTAIN / MISSING'}</span>
          </div>
          <input type="text" class="field-value" value="${escapeHtml(field.value)}" onchange="updateFieldValue('${key}', this.value)" placeholder="[EMPTY FIELD]" />
          ${!isSuccess ? `<div class="justification-text">${field.justification}</div>` : ''}
        `;

        container.appendChild(card);
      });
    }

    function updateFieldValue(key, val) {
      if (appState.extractedPayload[key]) {
        appState.extractedPayload[key].value = val;
        appState.extractedPayload[key].status = val ? 'success' : 'error';
        appState.extractedPayload[key].confidence = 100;
        renderFormUI();
      }
    }

    function switchSchema() {
      appState.currentSchema = document.getElementById('docTypeSelector').value;
      parseAndExtractData();
    }

    function exportJSON() {
      const output = {
        meta: {
          schema: appState.currentSchema,
          timestamp: new Date().toISOString(),
          engine: 'CyberOCR Architect v1.0.0'
        },
        payload: appState.extractedPayload
      };

      const blob = new Blob([JSON.stringify(output, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `OCR_Export_${appState.currentSchema}_${Date.now()}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
  </script>
</body>
</html>
