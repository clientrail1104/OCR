<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Neumorphic OCR Extractor</title>
    <!-- Load Tesseract.js for frontend OCR -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        :root {
            --bg-color: #1e1e24;
            --neon-color: #00ffcc;
            --shadow-light: #2a2a35;
            --shadow-dark: #121215;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            margin: 0;
            min-height: 100vh;
        }

        h1 {
            color: var(--neon-color);
            text-shadow: 0 0 5px var(--neon-color), 0 0 20px var(--neon-color);
            margin-bottom: 2rem;
            text-align: center;
        }

        .container {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
        }

        .upload-card {
            background: var(--bg-color);
            border-radius: 20px;
            padding: 2rem;
            width: 350px;
            box-shadow: 8px 8px 16px var(--shadow-dark), -8px -8px 16px var(--shadow-light);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .upload-card h2 {
            font-size: 1.2rem;
            margin-bottom: 1rem;
            color: #fff;
        }

        .upload-area {
            border: 2px dashed #444;
            border-radius: 15px;
            padding: 2rem;
            width: 100%;
            box-sizing: border-box;
            cursor: pointer;
            transition: 0.3s;
            margin-bottom: 1rem;
        }

        .upload-area:hover {
            border-color: var(--neon-color);
            box-shadow: inset 0 0 10px rgba(0, 255, 204, 0.2);
        }

        input[type="file"] {
            display: none;
        }

        button {
            background: var(--bg-color);
            color: var(--neon-color);
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
            transition: 0.2s;
        }

        button:hover {
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            text-shadow: 0 0 5px var(--neon-color);
        }

        button:disabled {
            color: #555;
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            cursor: not-allowed;
        }

        .results {
            margin-top: 2rem;
            width: 100%;
            max-width: 800px;
            background: var(--bg-color);
            border-radius: 20px;
            padding: 2rem;
            box-shadow: inset 8px 8px 16px var(--shadow-dark), inset -8px -8px 16px var(--shadow-light);
        }

        .results pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            color: #fff;
        }

        .status {
            color: var(--neon-color);
            margin-top: 1rem;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>Universal Document OCR</h1>

    <div class="container">
        <!-- Front Upload -->
        <div class="upload-card">
            <h2>Front of Document</h2>
            <div class="upload-area" onclick="document.getElementById('front-upload').click()">
                <p>Click or Drag Image Here</p>
                <small>Supports up to 500MB</small>
            </div>
            <input type="file" id="front-upload" accept="image/*,application/pdf">
            <button id="process-front" onclick="processImage('front-upload', 'status-front')" disabled>Scan Front</button>
            <div id="status-front" class="status"></div>
        </div>

        <!-- Back Upload -->
        <div class="upload-card">
            <h2>Back of Document</h2>
            <div class="upload-area" onclick="document.getElementById('back-upload').click()">
                <p>Click or Drag Image Here</p>
                <small>Required for NRIC/Licenses</small>
            </div>
            <input type="file" id="back-upload" accept="image/*,application/pdf">
            <button id="process-back" onclick="processImage('back-upload', 'status-back')" disabled>Scan Back</button>
            <div id="status-back" class="status"></div>
        </div>
    </div>

    <div class="results">
        <h2 style="color: var(--neon-color); margin-top:0;">Extracted Data (JSON)</h2>
        <pre id="json-output">Upload and scan a document to see results...</pre>
    </div>

    <script>
        // Enable buttons when files are selected
        document.getElementById('front-upload').addEventListener('change', (e) => {
            if(e.target.files.length > 0) document.getElementById('process-front').disabled = false;
        });
        document.getElementById('back-upload').addEventListener('change', (e) => {
            if(e.target.files.length > 0) document.getElementById('process-back').disabled = false;
        });

        // Main Processing Function
        async function processImage(inputId, statusId) {
            const file = document.getElementById(inputId).files[0];
            const statusEl = document.getElementById(statusId);
            const outputEl = document.getElementById('json-output');

            if (!file) return;

            // Warning for browser memory limits
            if (file.size > 100 * 1024 * 1024) {
                statusEl.innerText = "Warning: Files over 100MB may crash the browser. Backend required.";
                return;
            }

            statusEl.innerText = "Initializing OCR Engine...";
            
            try {
                // Tesseract.js recognizes inverted text if properly pre-processed
                const worker = await Tesseract.createWorker("eng", 1, {
                    logger: m => {
                        if (m.status === 'recognizing text') {
                            statusEl.innerText = `Scanning: ${(m.progress * 100).toFixed(0)}%`;
                        }
                    }
                });
                
                // Set parameters to strictly improve alphanumeric detection (6 vs 8, P vs F)
                await worker.setParameters({
                    tessedit_char_whitelist: 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789/-,. ',
                });

                const { data: { text } } = await worker.recognize(file);
                await worker.terminate();
                
                statusEl.innerText = "Scan Complete!";
                
                // Parse the raw text into structured data
                const parsedData = parseDocumentData(text);
                
                // Merge with existing output if back card is scanned
                let currentData = {};
                try { currentData = JSON.parse(outputEl.innerText); } catch(e) {}
                
                const finalData = { ...currentData, ...parsedData, rawText: text };
                outputEl.innerText = JSON.stringify(finalData, null, 4);

            } catch (error) {
                statusEl.innerText = "Error: " + error.message;
                statusEl.style.color = "#ff4444";
            }
        }

        // Data Parsing Architecture (Regex Engine)
        function parseDocumentData(rawText) {
            const data = { docType: "Unknown", errors: [] };
            
            // 1. Detect Malaysian NRIC (MyKad)
            const mykadRegex = /(\d{6}-\d{2}-\d{4})/g;
            const mykadMatch = rawText.match(mykadRegex);
            
            if (mykadMatch || rawText.toUpperCase().includes("KAD PENGENALAN")) {
                data.docType = "Malaysian NRIC";
                data.icNumber = mykadMatch ? mykadMatch[0] : "Not Detected";
                
                if(data.icNumber !== "Not Detected") {
                    const lastDigit = parseInt(data.icNumber.slice(-1));
                    data.gender = (lastDigit % 2 === 0) ? "Female (F)" : "Male (M)";
                    data.dob = formatMyKadDOB(data.icNumber.substring(0,6));
                }
            }
            
            // 2. Detect Passport via MRZ (Machine Readable Zone)
            const mrzRegex = /P<[A-Z]{3}[A-Z0-9<]+/g;
            if (rawText.match(mrzRegex) || rawText.toUpperCase().includes("PASPORT")) {
                data.docType = "Passport";
                // MRZ parsing logic would go here
            }

            // Reasonings for missed data
            if (!data.icNumber && !data.mrz) {
                data.errors.push("Reasoning: Cannot detect document type. The image might have heavy holograms obscuring text, or handwritten text clashing with typed fonts. OCR engine requires a clear, non-glare background.");
            }

            return data;
        }

        // Helper to format DOB from NRIC
        function formatMyKadDOB(yymmdd) {
            const year = parseInt(yymmdd.substring(0,2));
            const month = yymmdd.substring(2,4);
            const day = yymmdd.substring(4,6);
            const fullYear = year > 30 ? `19${year}` : `20${year}`;
            return `${day}/${month}/${fullYear}`;
        }
    </script>
</body>
</html>
